<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="calculator">

        <header class="header">
            <h2>Nova<span>.</span></h2>
            <p>SMART CALCULATOR</p>
        </header>

        <div class="display">
            <div id="expression">Ready for calculation</div>
            <input type="text" id="result" value="0"
                   readonly aria-label="Calculator display">
        </div>

        <div class="buttons">
            <button class="utility" data-action="clear">AC</button>
            <button class="utility" data-action="delete">DEL</button>
            <button class="utility" data-action="percent">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button class="utility" data-action="sign">+/−</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equals" data-action="calculate">=</button>
        </div>

        <footer>HTML · CSS · JAVASCRIPT</footer>

    </div>

</body>
</html>
